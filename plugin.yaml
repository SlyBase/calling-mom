name: calling-mom
label: Calling mom
kind: standalone
version: 1.3.0
manifest_version: 2
description: >
  Two-tier help for a cheap Kanban worker, without asking it to judge itself.
  Mom (a good, affordable model) answers stuck signals and risky changes;
  Olymp (the expensive heavyweight) is asked only when Mom escalates a rare edge
  case. Cards that give up or carry [crit] are pinned to Mom's model. Setup, status and
  doctor commands: hermes calling-mom.
provides_tools:
  - second_opinion
provides_hooks:
  - kanban_task_claimed
  - kanban_task_blocked
  - on_kanban_worker_exited
  - transform_tool_result
  - on_kanban_dispatch_tick
  - pre_tool_call
  - post_api_request
author: SlyBase
