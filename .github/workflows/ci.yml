name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push replaces the pull-request run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    # The full gate (all tests, 100 % coverage, copy drift) needs a Hermes venv and is run
    # by `check.py` on the host -- see README "Release gate". CI covers what a bare runner can.
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: compile every module
        run: python -m py_compile __init__.py _core.py metrics.py signals.py tests/test_signals.py tests/test_calling_mom.py tests/test_core.py tests/test_metrics.py tests/test_matrix.py tests/test_cli.py cli.py rules.py report.py tests/test_report.py precedents.py tests/test_precedents.py touches.py tests/test_touches.py feedback.py tests/test_feedback.py tests/test_count.py quota.py tests/test_quota.py tests/test_quota_flow.py tests/test_rules.py tests/test_dashboard.py dashboard/plugin_api.py scripts/demo.py scripts/smoke.py scripts/sweep.py tests/test_demo.py linecov.py check.py

      - name: plugin manifest is valid YAML with the required keys
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import sys, yaml
          m = yaml.safe_load(open("plugin.yaml"))
          required = {"name", "label", "kind", "version", "manifest_version", "description"}
          missing = required - set(m)
          assert not missing, f"plugin.yaml missing: {sorted(missing)}"
          assert m["name"] == "calling-mom", m["name"]
          assert isinstance(m.get("provides_hooks"), list) and m["provides_hooks"], "provides_hooks empty"
          assert {"kanban_task_claimed", "kanban_task_blocked", "on_kanban_worker_exited"} <= set(m["provides_hooks"])
          print("plugin.yaml ok, version", m["version"])
          PY

      - name: declared hooks match the register() calls
        run: |
          python - <<'PY'
          import re, sys, yaml
          declared = set(yaml.safe_load(open("plugin.yaml"))["provides_hooks"])
          src = open("__init__.py").read()
          registered = set(re.findall(r'ctx\.register_hook\("([^"]+)"', src))
          assert declared == registered, f"manifest/register mismatch: {declared ^ registered}"
          print("hooks match:", sorted(declared))
          PY

      - name: release archive ships every module the plugin imports
        run: |
          python - <<'PY'
          import os, re
          src = open("__init__.py").read()
          needed = set(re.findall(r'spec_from_file_location\("[^"]+", Path\(__file__\)\.with_name\("([^"]+)"\)', src))
          needed |= {m + ".py" for m in re.findall(r"^\s+from \. import (\w+)", src, re.M)}
          needed |= {d for d in ("desktop", "dashboard") if os.path.isdir(d)}
          release = open(".github/workflows/release.yml").read()
          missing = sorted(f for f in needed if f not in release)
          assert needed and not missing, f"release.yml archive misses: {missing} (found {sorted(needed)})"
          print("release ships", sorted(needed))
          PY

      - name: CHANGELOG has an entry for the manifest version
        run: |
          python - <<'PY'
          import re, yaml
          version = yaml.safe_load(open("plugin.yaml"))["version"]
          text = open("CHANGELOG.md").read()
          assert re.search(rf"^## \[{re.escape(version)}\]", text, re.M), f"no CHANGELOG section for {version}"
          print("changelog ok for", version)
          PY

  full-suite:
    # The real gate: the plugin against Hermes main. A red run
    # after a green history usually means "Hermes moved": fix the plugin or raise the minimum version.
    name: full suite against Hermes main
    # Slow (about 2-3 minutes), so it runs where it decides something: on main, by hand, and on pull requests
    # that are NOT drafts. Work in a draft PR (only the 10 s static job runs); mark it ready right before the
    # merge and this job runs then.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          path: hermes
      - uses: astral-sh/setup-uv@v6
      - name: install Hermes (its own lockfile and Python)
        working-directory: hermes
        run: uv sync --quiet
      - name: run the gate
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: ../hermes/.venv/bin/python check.py
