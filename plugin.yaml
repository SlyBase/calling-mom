name: calling-mom
label: Calling Mom
kind: standalone
version: 1.7.2
requires_hermes: ">=0.22"
manifest_version: 2
description: >
  Your attention is the most expensive model in the stack. Calling Mom calls it
  last. A cheap model works your Kanban cards; when it is stuck or about to do
  something risky, a better model steps in, and only what neither can settle
  reaches you, with a four-line brief.
provides_tools:
  - second_opinion
  - calling_mom_answer
provides_hooks:
  - kanban_task_claimed
  - kanban_task_blocked
  - on_kanban_worker_exited
  - transform_tool_result
  - on_kanban_dispatch_tick
  - pre_tool_call
  - post_api_request
  - on_human_input_request
  - on_human_input_resolved
  - api_request_error
author: SlyBase
